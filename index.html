<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="calculator">
        <div id="title">CALCULATORUL CREIZI</div>
        <div id="display">
            <div id="displayContent">0</div>
        </div>
        <div id="calculatorButtons">
            <div class="column" id="column1">
                <div class="row">
                    <button class="clear">C</button>
                </div>
                <div class="row">
                    <button class="digit">7</button>
                    <button class="digit">8</button>
                    <button class="digit">9</button>
                </div>
                <div class="row">
                    <button class="digit">4</button>
                    <button class="digit">5</button>
                    <button class="digit">6</button>
                </div>
                <div class="row">
                    <button class="digit">1</button>
                    <button class="digit">2</button>
                    <button class="digit">3</button>
                </div>
                <div class="row">
                    <button class="digit">0</button>
                    <button class="digit">.</button>
                    <button class="backspace">←</button>
                </div>
            </div>
            <div class="column" id="column2">
                <button class="operator">÷</button>
                <button class="operator">×</button>
                <button class="operator">-</button>
                <button class="operator">+</button>
                <button class="equal">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
